[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molmo2-frame-selector"
version = "0.1.0"
description = "Query-aware adaptive frame selection for efficient Molmo2 video inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
molmo2-select-frames = "molmo2_frame_selector.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

